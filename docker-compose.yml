version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sae_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - sae_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sae_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    # `pull_policy: build` (2026-09-23) - forca o `docker compose up` (o que
    # o Portainer roda num "Pull and redeploy") a REBUILDAR a imagem toda vez.
    # Sem isso, o compose so builda se a imagem `sae-api` ainda nao existir -
    # um redeploy recriava o container com a imagem ANTIGA e o commit novo
    # nunca chegava em producao ("nenhuma mudanca visivel"). O cache de
    # camadas do Docker continua valendo, entao um rebuild sem mudanca e rapido.
    pull_policy: build
    container_name: sae_api
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      # URL do Prisma para conectar no MySQL interno do Docker
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      # Pasta dos audios do Chat de Suporte (2026-09-23) - ver volume abaixo.
      - UPLOADS_DIR=/app/uploads
    volumes:
      # Volume NOMEADO (persistente) - sem ele, todo recreate do container
      # (o fluxo normal de deploy) apagaria os audios ja enviados no chat.
      - sae_uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sae_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    # Mesmo motivo do `api` acima - sem isso o bundle do React nunca era
    # rebuildado num redeploy do Portainer.
    pull_policy: build
    container_name: sae_web
    restart: unless-stopped
    ports:
      - "8081:80" # Porta 8081 para não conflitar com outros sistemas
    depends_on:
      - api
    networks:
      - sae_net

  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: sae_cloudflare
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    networks:
      - sae_net

volumes:
  sae_mysql_data:
  sae_uploads:

networks:
  sae_net:
    driver: bridge
