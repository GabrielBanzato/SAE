server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos gerados pelo Vite em /assets tem hash do conteudo no nome
    # (ex.: Suporte-Ab12Cd.js) - um build novo SEMPRE gera nomes novos, entao
    # podem ficar em cache "pra sempre" no navegador/Cloudflare sem risco.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (e qualquer rota SPA, que cai nele) NUNCA pode ficar em
    # cache (2026-09-23) - e ele que aponta pros /assets do build atual.
    # Sem este header, navegador/Cloudflare podiam continuar servindo o
    # index.html antigo (apontando pro bundle antigo) mesmo depois de um
    # deploy correto - "nenhuma mudanca visual" apesar do codigo novo.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
